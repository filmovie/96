<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV Player</title>
    <style>
        video {
            width: 100%;
            height: auto;
        }
        #channel-list {
            margin-top: 1px;
            max-height: 500px;
            overflow-y: auto;
        }
        .sidebar {
            width: 300px;
            background-color: #202020;
            padding: 20px;
            overflow-y: auto;
        }
        .sidebar h2 {
            color: #ff0000;
            margin-bottom: 20px;
            font-size: 24px;
        }
        .sidebar ul {
            list-style: none;
            padding: 0;
        }
        .sidebar ul li {
            margin-bottom: 10px;
            display: flex;
            align-items: center;
        }
        .sidebar ul li img {
            width: 40px; /* Adjust logo size */
            height: auto;
            margin-right: 10px;
        }
        .sidebar ul li a {
            color: #fff;
            text-decoration: none;
            display: block;
            padding: 10px;
            border-radius: 5px;
            background-color: #333;
            flex: 1; /* Make the anchor fill the remaining space */
        }
        .sidebar ul li a:hover {
            background-color: #444;
        }
        .search-bar {
            margin-bottom: 20px;
        }
        .search-bar input {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #333;
        }
        .content {
            flex: 1;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #121212;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <video id="player" controls>
            <!-- Video akan diputar di sini -->
        </video>
        <h2>Saluran</h2>
        <div class="search-bar">
            <input type="text" id="search" placeholder="Cari saluran...">
        </div>
        <ul id="channel-list">
            <!-- Saluran akan dimuat di sini -->
        </ul>
    </div>
    <div class="content">
        <!-- Content area -->
    </div>
    <script src="script.js"></script>
</body>
</html>
